<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Glassy CRM — V12</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:1080px; height:1920px; overflow:hidden; background:#000; }
  body {
    font-family:'Jost','Liberation Sans',sans-serif;
    color:#432818;
    -webkit-font-smoothing:antialiased;
  }
  /* ---------- TITLE ZONE ---------- */
  .title-zone { padding-top:104px; text-align:center; }
  .title-zone .name { font-size:96px; font-weight:600; letter-spacing:1px; color:#ffffff; line-height:1.05; }
  .title-zone .ver  { font-size:96px; font-weight:700; color:#FF7A1A; line-height:1.1; }
  /* ---------- MIDDLE ZONE — vivid warm stage ---------- */
  .stage {
    position:relative; margin-top:60px; height:694px; width:1080px;
    background:linear-gradient(160deg,#3a1c0a,#211105 70%); overflow:hidden;
  }
  .blob { position:absolute; border-radius:50%; filter:blur(60px); }
  .blob.b1 { width:680px; height:680px; background:#FF8A5C; left:-160px; top:-210px; opacity:.95; }
  .blob.b2 { width:640px; height:640px; background:#E4572E; right:-170px; top:10px; opacity:.85; }
  .blob.b3 { width:540px; height:540px; background:#FFB25E; left:300px; bottom:-280px; opacity:.8; }
  .blob.b4 { width:420px; height:420px; background:#FF5A49; right:180px; bottom:-220px; opacity:.55; }
  /* dashboard window — 954x586, transparent white glass: no colour of its own;
     the warm stage blobs behind the panel supply every tint */
  .dash {
    position:absolute; left:63px; top:54px; width:954px; height:586px;
    border-radius:34px;
    background:linear-gradient(155deg, rgba(255,255,255,.52), rgba(255,255,255,.30) 55%, rgba(255,255,255,.38));
    border:1px solid rgba(255,255,255,.65);
    box-shadow:0 40px 90px rgba(43,16,2,.5), inset 0 1px 0 rgba(255,255,255,.7);
    backdrop-filter:blur(22px) saturate(150%);
    overflow:hidden;
    display:flex;
  }
  /* ---------- INTEGRATED SIDEBAR — warm glass rail ---------- */
  .side {
    width:172px; flex:0 0 172px; height:100%;
    background:linear-gradient(180deg, rgba(255,255,255,.30), rgba(255,255,255,.14));
    border-right:1px solid rgba(255,255,255,.5);
    display:flex; flex-direction:column; padding:20px 14px 16px;
  }
  .logo { display:flex; align-items:center; gap:9px; padding:0 6px; }
  .logo .lg {
    width:30px; height:30px; border-radius:9px; flex:0 0 30px;
    background:linear-gradient(145deg,#F0562F,#C9330F);
    display:flex; align-items:center; justify-content:center;
    font-size:15px; font-weight:700; color:#fff;
    box-shadow:0 6px 14px rgba(217,60,15,.45);
  }
  .logo .ln { font-size:14.5px; font-weight:600; color:#3A2113; line-height:1.1; }
  .logo .ln span { display:block; font-size:10px; font-weight:500; color:rgba(67,40,24,.5); letter-spacing:.6px; }
  .nav { margin-top:22px; display:flex; flex-direction:column; gap:5px; }
  .nitem {
    display:flex; align-items:center; gap:10px; padding:8px 10px; border-radius:11px;
    font-size:13.5px; font-weight:500; color:rgba(67,40,24,.62);
    border:1px solid transparent;
  }
  .nitem svg { width:16px; height:16px; flex:0 0 16px; }
  .nitem .bdg { margin-left:auto; font-size:10px; font-weight:700; background:#D63C14; color:#fff; border-radius:999px; padding:1px 6px; }
  .nitem.on {
    background:rgba(255,255,255,.92); color:#3A2113; font-weight:600;
    border-color:rgba(255,255,255,.9);
    box-shadow:0 8px 18px rgba(146,64,14,.22), inset 0 1px 0 #fff;
  }
  .side .sp { flex:1; }
  .aicard2 {
    border-radius:14px; padding:10px 11px;
    background:linear-gradient(150deg, rgba(255,255,255,.5), rgba(255,214,170,.35));
    border:1px solid rgba(255,255,255,.6);
  }
  .aicard2 .at { font-size:11.5px; font-weight:600; color:#8A3B12; display:flex; align-items:center; gap:6px; }
  .aicard2 .at i { width:6px; height:6px; border-radius:50%; background:#F0562F; display:block; }
  .aicard2 .am { font-size:10.5px; color:rgba(67,40,24,.6); line-height:1.35; margin-top:3px; }
  .userchip { display:flex; align-items:center; gap:9px; margin-top:12px; padding:0 4px; }
  .userchip .un { font-size:12px; font-weight:600; color:#3A2113; line-height:1.15; }
  .userchip .un span { display:block; font-size:10px; color:rgba(67,40,24,.45); font-weight:400; }
  /* ---------- MAIN ---------- */
  .main2 { flex:1; min-width:0; display:flex; flex-direction:column; }
  .topbar {
    flex:0 0 56px; display:flex; align-items:center; gap:14px; padding:0 22px;
    border-bottom:1px solid rgba(146,64,14,.14);
  }
  .search {
    flex:1; max-width:340px; height:34px; border-radius:999px;
    background:rgba(255,255,255,.4); border:1px solid rgba(255,255,255,.55);
    display:flex; align-items:center; gap:8px; padding:0 14px;
    font-size:12.5px; color:rgba(67,40,24,.5);
  }
  .search svg { width:14px; height:14px; }
  .topbar .ghost {
    font-size:12.5px; font-weight:500; color:rgba(67,40,24,.7);
    border:1px solid rgba(146,64,14,.25); border-radius:999px; padding:7px 13px; white-space:nowrap;
    background:rgba(255,255,255,.3);
  }
  .topbar .tbtn {
    font-size:12.5px; font-weight:600; color:#fff;
    background:linear-gradient(120deg,#F0562F,#C9330F); border-radius:999px; padding:8px 15px;
    box-shadow:0 8px 18px rgba(217,60,15,.4); white-space:nowrap;
  }
  .views { position:relative; flex:1; min-height:0; }
  .view { position:absolute; inset:0; padding:18px 22px 16px; display:flex; flex-direction:column; gap:13px; opacity:0; overflow:hidden; }
  /* ---------- dashboard scroll column — two screens inside view 0 ---------- */
  .vscroll { flex:0 0 auto; display:flex; flex-direction:column; gap:13px; will-change:transform; }
  .screen { flex:0 0 496px; height:496px; display:flex; flex-direction:column; gap:12px; }
  .screenA .herorow { flex:0 0 222px; }
  .screenA .statrow { flex:0 0 144px; }
  .qpills { flex:0 0 36px; display:flex; gap:8px; }
  .qpill {
    flex:1; display:flex; align-items:center; justify-content:center; white-space:nowrap; overflow:hidden;
    font-size:11.5px; font-weight:600; color:#8A3B12;
    background:rgba(255,255,255,.5); border:1px solid rgba(255,255,255,.65); border-radius:999px;
    box-shadow:0 8px 18px rgba(146,64,14,.14), inset 0 1px 0 rgba(255,255,255,.7);
    opacity:0;
  }
  .scrollrow { flex:1; min-height:0; display:flex; gap:13px; }
  .chancard { flex:1.28; padding:14px 16px 12px; display:flex; flex-direction:column; overflow:hidden; }
  .chancard .cht { font-size:15px; font-weight:600; color:#3A2113; }
  .chancard .chsub { font-size:11px; color:rgba(67,40,24,.45); font-weight:500; margin-top:2px; }
  .chanviz { position:relative; width:118px; height:118px; margin:12px auto 4px; }
  .chanviz .chtotal { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; }
  .chanviz .chtotal b { font-size:19px; font-weight:700; color:#3A2113; line-height:1; }
  .chanviz .chtotal span { font-size:9px; font-weight:600; letter-spacing:.6px; color:rgba(67,40,24,.5); margin-top:3px; }
  .chrow { display:flex; align-items:center; gap:8px; padding:6px 2px; border-top:1px solid rgba(146,64,14,.10); opacity:0; }
  .chrow i { width:9px; height:9px; border-radius:3px; flex:0 0 9px; }
  .chrow .chn { font-size:12px; font-weight:600; color:#3A2113; }
  .chrow .chp { margin-left:auto; font-size:11px; font-weight:500; color:rgba(67,40,24,.5); }
  .chrow .chv { font-size:12.5px; font-weight:700; color:#3A2113; min-width:52px; text-align:right; }
  .vhead { display:flex; align-items:baseline; justify-content:space-between; flex:0 0 auto; }
  .vhead .vt { font-size:24px; font-weight:600; color:#3A2113; letter-spacing:.2px; }
  .vhead .vs { font-size:12px; color:rgba(67,40,24,.5); display:flex; align-items:center; gap:6px; }
  .vhead .vs .livedot { width:7px; height:7px; border-radius:50%; background:#F0562F; display:inline-block; }
  .vhead .vs b { color:#C2430F; font-weight:600; }
  .gcard {
    background:rgba(255,255,255,.45);
    border:1px solid rgba(255,255,255,.62);
    border-radius:20px;
    box-shadow:0 14px 30px rgba(146,64,14,.16), inset 0 1px 0 rgba(255,255,255,.65);
  }
  .av { border-radius:50%; display:flex; align-items:center; justify-content:center; font-weight:600; color:#fff; flex:0 0 auto; }
  /* ---------- 0 · DASHBOARD — greeting + hero + stats + calendar ---------- */
  .greet { flex:0 0 auto; }
  .greet .gt { font-size:27px; font-weight:600; color:#3A2113; letter-spacing:.2px; line-height:1.1; }
  .greet .gt span { color:#C2430F; }
  .greet .gs { font-size:12.5px; color:rgba(67,40,24,.55); margin-top:4px; }
  .herorow { display:flex; gap:13px; flex:0 0 234px; min-height:0; }
  .hero {
    flex:1.86; border-radius:24px; padding:13px 20px 11px; position:relative; overflow:hidden; min-height:0;
    background:linear-gradient(135deg,#F0562F 0%,#DE4218 55%,#C9330F 100%);
    box-shadow:0 22px 44px rgba(190,50,10,.4), inset 0 1px 0 rgba(255,255,255,.35);
    color:#fff; display:flex; flex-direction:column;
  }
  .hero::after {
    content:''; position:absolute; width:340px; height:340px; border-radius:50%;
    right:-110px; top:-160px; background:radial-gradient(circle, rgba(255,205,150,.5), rgba(255,205,150,0) 70%);
  }
  .hero .hpill {
    align-self:flex-start; font-size:10.5px; font-weight:600; letter-spacing:.3px;
    background:rgba(255,255,255,.22); border:1px solid rgba(255,255,255,.35);
    padding:3px 10px; border-radius:999px; display:flex; align-items:center; gap:6px;
  }
  .hero .hpill i { width:6px; height:6px; border-radius:50%; background:#FFD9A8; display:block; }
  .hero .hh { font-size:23px; font-weight:600; line-height:1.18; margin-top:9px; max-width:300px; }
  .hero .hh em { font-family:Georgia,'Times New Roman',serif; font-style:italic; font-weight:500; }
  .hero .hsub2 { font-size:11.5px; color:rgba(255,240,230,.75); line-height:1.4; margin-top:5px; max-width:290px; }
  .hero .hstats { display:flex; gap:18px; margin-top:auto; }
  .hero .hstat b { font-size:17px; font-weight:700; display:block; line-height:1.1; }
  .hero .hstat span { font-size:9.5px; color:rgba(255,240,230,.65); letter-spacing:.3px; }
  .hero .hbtns { display:flex; gap:8px; margin-top:9px; }
  .hero .hb1 { font-size:11.5px; font-weight:600; background:#fff; color:#C2430F; padding:6px 13px; border-radius:999px; }
  .hero .hb2 { font-size:11.5px; font-weight:500; color:#fff; border:1px solid rgba(255,255,255,.55); padding:6px 13px; border-radius:999px; }
  .ringwrap { position:absolute; right:16px; top:50%; transform:translateY(-50%); width:158px; height:158px; }
  .ringwrap .rc { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); text-align:center; }
  .ringwrap .rc b { font-size:27px; font-weight:700; display:block; line-height:1; }
  .ringwrap .rc span { font-size:9.5px; color:rgba(255,240,230,.75); letter-spacing:.4px; }
  .ringav { position:absolute; width:26px; height:26px; border-radius:50%; border:2px solid rgba(255,255,255,.85);
    display:flex; align-items:center; justify-content:center; font-size:9px; font-weight:700; color:#fff; }
  .calcard { flex:1; padding:14px 16px 11px; display:flex; flex-direction:column; overflow:hidden; }
  .calcard .chead { display:flex; align-items:flex-start; justify-content:space-between; }
  .calcard .cday { font-size:34px; font-weight:700; color:#D63C14; line-height:1; }
  .calcard .cmon { font-size:12.5px; font-weight:600; color:#3A2113; line-height:1.25; }
  .calcard .cmon span { display:block; font-size:10.5px; font-weight:500; color:rgba(67,40,24,.5); }
  .weekstrip { display:flex; gap:4px; margin-top:11px; }
  .wd { flex:1; text-align:center; padding:5px 0 4px; border-radius:9px; font-size:10px; font-weight:600; color:rgba(67,40,24,.55); }
  .wd b { display:block; font-size:12.5px; font-weight:700; color:#3A2113; margin-top:1px; }
  .wd.on { background:#D63C14; color:rgba(255,235,225,.85); box-shadow:0 6px 12px rgba(214,60,20,.35); }
  .wd.on b { color:#fff; }
  .cev { display:flex; gap:9px; margin-top:10px; padding:8px 10px; border-radius:12px; background:rgba(255,255,255,.5); border:1px solid rgba(255,255,255,.6); align-items:flex-start; }
  .cev .ct3 { font-size:11px; font-weight:700; color:#C2430F; flex:0 0 34px; padding-top:1px; }
  .cev .cb { flex:1; min-width:0; }
  .cev .cn2 { font-size:12px; font-weight:600; color:#3A2113; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .cev .cs2 { font-size:10.5px; color:rgba(67,40,24,.5); margin-top:1px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .cev .next { font-size:9px; font-weight:700; letter-spacing:.5px; color:#C2430F; background:rgba(240,86,47,.14); border:1px solid rgba(240,86,47,.35); padding:2px 7px; border-radius:999px; flex:0 0 auto; }
  .statrow { display:flex; gap:13px; flex:1; min-height:0; }
  .stat { flex:1; padding:13px 16px 11px; display:flex; flex-direction:column; overflow:hidden; position:relative; }
  .stat .stop { display:flex; align-items:flex-start; justify-content:space-between; }
  .stat .sic { width:30px; height:30px; border-radius:10px; background:rgba(255,255,255,.65); border:1px solid rgba(255,255,255,.7);
    display:flex; align-items:center; justify-content:center; color:#C2430F; }
  .stat .sic svg { width:16px; height:16px; }
  .stat .chg { font-size:10.5px; font-weight:700; color:#15803D; background:rgba(22,163,74,.13); border:1px solid rgba(22,163,74,.25); padding:2px 8px; border-radius:999px; }
  .stat .sval { font-size:31px; font-weight:700; color:#3A2113; line-height:1.1; margin-top:9px; }
  .stat .slab { font-size:12.5px; font-weight:600; color:#3A2113; margin-top:1px; }
  .stat .ssub { font-size:10.5px; color:rgba(67,40,24,.5); margin-top:1px; }
  .stat .spark { position:absolute; right:12px; bottom:9px; opacity:.85; }
  .stat.red { background:linear-gradient(140deg,#F0562F,#C9330F); border-color:rgba(255,255,255,.35); box-shadow:0 18px 36px rgba(190,50,10,.35), inset 0 1px 0 rgba(255,255,255,.3); }
  .stat.red .sic { background:rgba(255,255,255,.22); border-color:rgba(255,255,255,.3); color:#fff; }
  .stat.red .chg { color:#D9F99D; background:rgba(255,255,255,.16); border-color:rgba(255,255,255,.3); }
  .stat.red .sval, .stat.red .slab { color:#fff; }
  .stat.red .ssub { color:rgba(255,240,230,.65); }
  /* ---------- 1 · ANALYTICS — stat row + revenue chart ---------- */
  .chartcard { flex:1; padding:14px 18px 10px; display:flex; flex-direction:column; overflow:hidden; min-height:0; }
  .chartcard .ct { font-size:15px; font-weight:600; color:#3A2113; display:flex; align-items:center; justify-content:space-between; }
  .chartcard .ct .csub2 { font-size:11px; color:rgba(67,40,24,.45); font-weight:500; margin-top:2px; }
  .chartcard .legend { display:flex; gap:14px; font-size:11px; font-weight:500; color:rgba(67,40,24,.6); align-items:center; }
  .chartcard .legend i { width:8px; height:8px; border-radius:50%; display:inline-block; margin-right:5px; }
  .rangewrap { display:flex; align-items:center; gap:9px; margin-top:9px; }
  .rpill { font-size:11px; font-weight:500; color:rgba(67,40,24,.6); background:rgba(255,255,255,.5); border:1px solid rgba(255,255,255,.6); padding:5px 12px; border-radius:999px; }
  .rpill.on { background:#3A2113; color:#FFF3E8; border-color:#3A2113; font-weight:600; }
  .recbtn { margin-left:auto; font-size:11.5px; font-weight:600; color:#fff; background:linear-gradient(120deg,#F0562F,#C9330F); padding:6px 13px; border-radius:999px; box-shadow:0 8px 16px rgba(217,60,15,.35); }
  .hmonths { display:flex; justify-content:space-between; font-size:10.5px; color:rgba(67,40,24,.4); font-weight:500; padding:3px 2px 2px; }
  /* ---------- OPENING — logo moment over the blurred dashboard ---------- */
  .openlayer {
    position:absolute; inset:0; z-index:5; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:0;
    background:radial-gradient(circle at 50% 46%, rgba(255,150,80,.20), rgba(24,10,2,.55) 62%, rgba(16,6,1,.78));
  }
  .openlayer .omark {
    width:74px; height:74px; border-radius:20px;
    background:linear-gradient(145deg,#F0562F,#C9330F);
    display:flex; align-items:center; justify-content:center;
    font-size:38px; font-weight:700; color:#fff;
    box-shadow:0 18px 40px rgba(240,86,47,.5), inset 0 1px 0 rgba(255,255,255,.4);
  }
  .openlayer .oname { margin-top:20px; font-size:31px; font-weight:600; letter-spacing:7px; color:#fff; padding-left:7px; }
  .openlayer .osub { margin-top:7px; font-size:12.5px; font-weight:500; letter-spacing:3.5px; color:rgba(255,232,214,.55); padding-left:3.5px; }
  .openlayer .obar { margin-top:22px; width:128px; height:3px; border-radius:999px; background:rgba(255,255,255,.18); overflow:hidden; }
  .openlayer .obar i { display:block; height:100%; width:0%; background:linear-gradient(90deg,#FFB25E,#F0562F); border-radius:999px; }
  /* ---------- CODE ZONE (format unchanged) ---------- */
  .codewin {
    margin:56px 48px 0; height:596px; border-radius:24px; overflow:hidden;
    background:#0b0e15; border:1px solid rgba(255,255,255,.11);
    box-shadow:0 34px 80px rgba(0,0,0,.6);
  }
  .codebar {
    height:64px; background:#11141d; display:flex; align-items:center; gap:9px;
    padding:0 22px; border-bottom:1px solid rgba(255,255,255,.06);
  }
  .cdot { width:15px; height:15px; border-radius:50%; }
  .tab {
    margin-left:20px; background:#0b0e15; border:1px solid rgba(255,255,255,.08); border-bottom:none;
    padding:9px 18px; border-radius:10px 10px 0 0; font-family:'Liberation Mono',monospace;
    font-size:16.5px; color:#d7deeb; align-self:flex-end; height:44px; display:flex; align-items:center;
  }
  .tab i { color:#ff8a3d; font-style:normal; }
  pre {
    padding:30px 34px; font-family:'Liberation Mono','DejaVu Sans Mono',monospace;
    font-size:23.5px; line-height:1.85; color:#a9b7d0; white-space:pre;
  }
  .k { color:#FF8A5C; } .s { color:#9ece6a; } .t { color:#FF8A5C; }
  .f { color:#FFC46B; } .p { color:#89ddff; } .n { color:#f78c6c; } .cm { color:#6b5a4a; }
</style>

  <div class="title-zone">
    <div class="name">Glassy CRM</div>
    <div class="ver">V12</div>
  </div>

  <div class="stage">
    <div class="blob b1"></div>
    <div class="blob b2"></div>
    <div class="blob b3"></div>
    <div class="blob b4"></div>
    <div class="dash" id="dash">
      <div class="side">
        <div class="logo"><div class="lg">N</div><div class="ln">Northbeam<span>BUILDERS</span></div></div>

      </div>
      <div class="main2">
        <div class="topbar">

          <span class="tbtn">+ New enquiry</span>

        <div class="views" id="views"></div>
      </div>
    </div>
    <div class="openlayer" id="openlayer">
      <div class="omark">N</div>
      <div class="oname">NORTHBEAM</div>

  </div>

  <div class="codewin">
    <div class="codebar">
      <div class="cdot" style="background:#ff5f57"></div>
      <div class="cdot" style="background:#febc2e"></div>

<script>

function renderAt(t) {
  let XF = 0.2;
  const clamp = (x,a,b)=>Math.max(a,Math.min(b,x));
  const easeOut = x=>1-Math.pow(1-x,3);
  const smooth = x=>{ x = clamp(x,0,1); return x*x*(3-2*x); };
  let slot = 0;
  for (let i = 0; i < STARTS.length; i++) if (t >= STARTS[i]) slot = i;
  const lt = t - STARTS[slot];
  if (slot === 2) XF = 0.001; /* analytics arrives on a hard cut, no crossfade */
  const cur = VMAP[slot], prv = slot > 0 ? VMAP[slot - 1] : -1;

  document.querySelectorAll('.view').forEach((el,i)=>{
    let op = 0, age = 0;
    if (i === cur)      { op = (prv === cur || slot === 0) ? 1 : (lt < XF ? smooth(lt / XF) : 1); age = i === 0 ? Math.max(0, t - 1.1) : lt; }
    else if (i === prv) { op = lt < XF ? 1 - smooth(lt / XF) : 0; age = t; }
    el.style.opacity = op.toFixed(3);
    el.style.zIndex = i === cur ? 2 : 1;
    el.style.visibility = op <= 0 ? 'hidden' : 'visible';
    if (op <= 0) return;
    const p = easeOut(clamp(age / 0.9, 0, 1));
    el.querySelectorAll('[data-count]').forEach(c=>{
      const raw = parseFloat(c.dataset.count) * p;
      const v = Math.round(raw);
      c.textContent = c.dataset.dec ? (raw / 10).toFixed(1) : (c.dataset.fmt ? v.toLocaleString('en-GB') : v);
    });
    el.querySelectorAll('[data-ring]').forEach(r=>{
      const C = 389.6, target = parseFloat(r.dataset.ring) / 100;
      const rp = easeOut(clamp((age - 0.15) / 0.9, 0, 1));
      r.setAttribute('stroke-dasharray', (C * target * rp).toFixed(1) + ' ' + C);
    });
    el.querySelectorAll('.aline').forEach(s=>{
      const len = parseFloat(s.dataset.len);
      const sp = easeOut(clamp((age - 0.1) / 0.8, 0, 1));
      s.style.strokeDashoffset = (len * (1 - sp)).toFixed(1);
    });
  });

  /* opening layer — logo moment over the blurred dashboard, clears by slot 1 */
  const openP = slot === 0 ? smooth((lt - 0.85) / 0.55) : 1;
  const ol = document.getElementById('openlayer');
  ol.style.opacity = (1 - openP).toFixed(3);
  ol.style.visibility = openP >= 1 ? 'hidden' : 'visible';
  document.getElementById('openbar').style.width = (easeOut(clamp(t / 1.3, 0, 1)) * 100).toFixed(1) + '%';
  const dash = document.getElementById('dash');
  dash.style.filter = openP >= 1 ? 'none' : `blur(${((1 - openP) * 24).toFixed(1)}px) brightness(${(0.5 + 0.5 * openP).toFixed(3)})`;

  /* sidebar active state — flips at the boundary */
  document.querySelectorAll('.nitem[data-ic]').forEach(ic=>{
    ic.classList.toggle('on', parseInt(ic.dataset.ic) === NAVMAP[slot]);
  });
  /* code tab follows the page on screen */
  document.getElementById('codetab').innerHTML = FILES[slot] + '<i>.jsx</i>';
  const cb = document.getElementById('codebody');
  if (cb && cb.dataset.slot !== String(slot)) { cb.innerHTML = '<code>' + SNIPPETS[slot] + '</code>'; cb.dataset.slot = slot; }
  /* beat (c) · quick-action pills stagger in under the stat cards, 3.3–4.1 */
  document.querySelectorAll('.qpill').forEach((p,i)=>{
    const pp = smooth((t - 3.3 - i * 0.07) / 0.4);
    p.style.opacity = pp.toFixed(3);
    p.style.transform = `translateY(${((1 - pp) * 10).toFixed(1)}px)`;
  });
  /* beat (d) · smooth scroll inside the dashboard, 4.3–5.5 (one full screen) */
  const scrollP = smooth((t - 4.3) / 1.2);
  const ds = document.getElementById('dashscroll');
  if (ds) ds.style.transform = `translateY(${(-509 * scrollP).toFixed(1)}px)`;
  /* screen B draws as it arrives: chart lines, channel donut, rows */
  document.querySelectorAll('.aline2').forEach(s=>{
    const len = parseFloat(s.dataset.len);
    const sp2 = easeOut(clamp((t - 4.95) / 0.95, 0, 1));
    s.style.strokeDashoffset = (len * (1 - sp2)).toFixed(1);
  });
  const cv = document.getElementById('chanviz');
  if (cv) cv.style.opacity = easeOut(clamp((t - 4.95) / 0.6, 0, 1)).toFixed(3);
  document.querySelectorAll('.seg').forEach(s=>{
    const C = 289, f = parseFloat(s.dataset.frac), d = parseFloat(s.dataset.delay || 0);
    const lp = easeOut(clamp((t - 5.0 - d) / 0.7, 0, 1));
    const len = Math.max(0, C * f * lp - (lp > 0 ? 3 : 0));
    s.setAttribute('stroke-dasharray', len.toFixed(1) + ' ' + C);
  });
  document.querySelectorAll('.chrow').forEach((r,i)=>{
    const rp = smooth((t - 5.2 - i * 0.09) / 0.45);
    r.style.opacity = rp.toFixed(3);
    r.style.transform = `translateX(${((1 - rp) * 14).toFixed(1)}px)`;
  });

  /* live dots — continuous, subtle, like a real app */
  const pulse = 0.55 + 0.45 * Math.sin(t * 2.4);
  document.querySelectorAll('.livedot, .livedot2').forEach(d=>{ d.style.opacity = pulse.toFixed(3); });
}
window.renderAt = renderAt;
renderAt(parseFloat(new URLSearchParams(location.search).get('t') || '0'));
</script>
</body>
</html>
