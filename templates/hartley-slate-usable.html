   Inside a view, only in-place micro-animation: counters, bars growing from
   their baseline, donut drawing, one pill flip, AI typing dots. */
function renderAt(t) {
  const DUR = 1.5, XF = 0.2;
  const clamp = (x,a,b)=>Math.max(a,Math.min(b,x));
  const easeOut = x=>1-Math.pow(1-x,3);
  const smooth = x=>{ x = clamp(x,0,1); return x*x*(3-2*x); };
  const slotF = t / DUR;
  const slot = Math.floor(slotF) % 4;
  const lt = t - Math.floor(slotF) * DUR;
  const prev = (slot + 3) % 4;

  document.querySelectorAll('.view').forEach((el,i)=>{
    let op = 0, age = 0;
    if (i === slot)      { op = lt < XF ? smooth(lt / XF) : 1; age = lt; }
    else if (i === prev) { op = lt < XF ? 1 - smooth(lt / XF) : 0; age = DUR + lt; }
    el.style.opacity = op.toFixed(3);
    el.style.zIndex = i === slot ? 2 : 1;
    el.style.visibility = op <= 0 ? 'hidden' : 'visible';
    if (op <= 0) return;
    const p = easeOut(clamp(age / 0.9, 0, 1));
    el.querySelectorAll('[data-count]').forEach(c=>{
      const v = Math.round(parseFloat(c.dataset.count) * p);
      c.textContent = c.dataset.fmt ? v.toLocaleString('en-GB') : v;
    });
    el.querySelectorAll('[data-bar]').forEach(b=>{
      const bp = easeOut(clamp((age - 0.05 - parseInt(b.dataset.bar) * 0.03) / 0.65, 0, 1));
      b.style.transform = `scaleY(${Math.max(0.02, bp).toFixed(3)})`;
    });
    el.querySelectorAll('.garc').forEach(g=>{
      const C = 2 * Math.PI * 50;
      g.style.strokeDasharray = C;
      g.style.strokeDashoffset = (C * (1 - parseFloat(g.dataset.pct) * p)).toFixed(1);
    });
    el.querySelectorAll('.seg').forEach((s,idx)=>{
      const len = parseFloat(s.dataset.len);
      const sp = easeOut(clamp((age - 0.1 - idx * 0.12) / 0.7, 0, 1));
      s.style.strokeDashoffset = (len * (1 - sp)).toFixed(1);
    });
    el.querySelectorAll('[data-fade]').forEach(f=>{
      const fp = easeOut(clamp((age - parseFloat(f.dataset.fade)) / 0.45, 0, 1));
      f.style.opacity = fp.toFixed(3);
    });
    el.querySelectorAll('.linepath').forEach(s=>{
      const lp = easeOut(clamp((age - 0.1) / 0.9, 0, 1));
      s.style.strokeDashoffset = (100 * (1 - lp)).toFixed(1);
    });
    el.querySelectorAll('.areafill').forEach(s=>{
      const lp = easeOut(clamp((age - 0.1) / 0.9, 0, 1));
      s.style.opacity = (0.95 * lp).toFixed(3);
    });
    const fw = el.querySelector('.flipwrap');
    if (fw) {
      const fp = clamp((age - 1.05) / 0.15, 0, 1);
      fw.querySelector('.flipA').style.opacity = (1 - fp).toFixed(3);
      fw.querySelector('.flipB').style.opacity = fp.toFixed(3);
    }
  });

  /* sidebar active state — flips at the boundary, dot fades in over 150ms */
  document.querySelectorAll('.ric[data-ic]').forEach(ic=>{
    const on = parseInt(ic.dataset.ic) === slot;
    ic.classList.toggle('on', on);
    ic.querySelector('.dot').style.opacity = on ? clamp(lt / 0.15, 0, 1).toFixed(3) : 0;
  });
  /* live dots + AI typing dots — continuous, subtle, like a real app */
  const pulse = 0.55 + 0.45 * Math.sin(t * 2.4);
  const ld = document.getElementById('livedot');
  if (ld) ld.style.opacity = pulse.toFixed(3);
  document.querySelectorAll('.livedot2').forEach(d=>{ d.style.opacity = pulse.toFixed(3); });
  document.querySelectorAll('.tdot').forEach((d,k)=>{
    d.style.opacity = (0.3 + 0.4 * (0.5 + 0.5 * Math.sin(t * 4.2 - k * 1.05))).toFixed(3);
  });
}
window.renderAt = renderAt;
renderAt(parseFloat(new URLSearchParams(location.search).get('t') || '0'));
</script>
<script>
/* ---------- template interactivity: rail + dock switch views, loop plays ---------- */
let slotBase = 0;
const t0 = performance.now();
function setSlot(i){ slotBase = i * 1.5; }
document.querySelectorAll('.ric[data-ic]').forEach(ic => ic.addEventListener('click', () => setSlot(parseInt(ic.dataset.ic))));
document.querySelectorAll('.dock span').forEach((sp, i) => { if (i < 4) sp.addEventListener('click', () => setSlot(i)); });
(function loop(now){
  const el = (now - t0) / 1000;
  renderAt(slotBase + (el % 1.5));
  requestAnimationFrame(loop);
})(t0);
function fit(){
  const s = Math.min(1.12, (window.innerWidth - 40) / 1080);
  document.querySelector('.scaler').style.transform = 'scale(' + s + ')';
  document.querySelector('.scaler').style.height = (748 * s) + 'px';
}
window.addEventListener('resize', fit); fit();
</script>
</body>
</html>
